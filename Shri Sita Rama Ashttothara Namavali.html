<button type="button" onclick='document.getElementById("hcontent").innerHTML="OM SRI RAMAYA NAMAHA: <br>SRI RAMA ,as the name suggests is an all-pervading entity.He knows dharma,speaks the truth,is full of virtues and is disciplined,and is the eldest prince of the Ikshvakus.Rama means the supreme source of unlimited pleasure and enjoyment.<br>" '>1</button>

<button type="button" onclick='document.getElementById("hcontent").innerHTML="OM SRI RAMABHADRAYA NAMAHA: <br>Auspicious Rama,The lotus-eyed,moon faced Rama is the noble and valiant warrior of the Raghu race.Ever gracious to the noble and the holy men,He personsnifies auspiciousness.<br>" '>2</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM SRI RAMACHANDRAYA NAMAHA:Moon-like gentle Rama,With fine locks of hair covering His forehead, Lord Ramas moon-like face is the source of eternal bliss and happiness.With a charming smile adorning His face, Lord Rama personifies all things beautiful. <br><br>" '>3</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM SHASHVATHAYA NAMAHA: <br>Lord Rama, an avatar of Lord Vishnu, symbolizes Supreme Power, who is beyond reason, and vision, who has no beginning or end, who is without attributes. He is Narayana, the Eternal Divinity.<br>" '>4</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM RAJEEVALOCHANAYA NAMAHA: <br>The ever-pleasant-faced Rama is lotus-eyed, whose eyes are large like a full-blown lotus. These eyes, reflecting gentleness and calmness, see all and their vision is limitless.<br>" '>5</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM SRIMATHEY NAMAHA:<br>Respected by all and respectable for everyone, He is the Master of all norms. He is adored by the sages, the mortals, and even by Lord Shiva and Lord Brahma.<br>" '>6</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM RAJENDRAYA NAMAHA: <br>Lord Rama is the whole world in His manifest form. He is unperceivable by senses, yet He is instinct in every life. He is the Protector of all realms, the cause of all existence.<br>" '>7</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM RAGHUPUNGAVAYA NAMAHA:<br>The great descendant of the Raghu race,Lord Rama is noble-minded and valiant. As an upholder of dharma, He believes in goodness and always keeps His word.<br>" '>8</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM JANAKIVALLABHAYA NAMAHA:<br>The Supreme Lord Rama has for His consort,Goddess Sita who is born womb less,found by Her father Janaka while ploughing a field. He sacrifices Her to the earth to establish dharma.<br>" '>9</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM JAITHRAYA NAMAHA: <br>Wielder of the bow with gold-feathered arrows, Lord Ramas valour and prowess are unequalled. With full knowledge of war strategies, He personifies victory.<br>" '>10</button><br><br>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM JITHA MITHRAYA NAMAHA: <br>Lord Rama,known for His noble deeds and justice; and representing victory, conquers His foes, for He has no equal.<br>" '>11</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM JANARDHANAYA NAMAHA:<br>The Dharmadhita of the Solar race, Lord Rama is an endless fountain head of virtues showing dharma, truth, forgiveness, gratitude, compassion, duty and gentleness,and offers liberation of the blessed from the cycle of repeated births.<br>" '>12</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM VISHWAMITHRA PRIYAYA NAMAHA:<br>The ocean of knowledge and the mine of virtues, Lord Rama is greatly worshipped and revered by the great sage Vishwamithra for His righteous and just nature .<br>" '>13</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM DANTHAYA NAMAHA:<br>With a moon-like serene face, and a pleasing smile that lights up His gentle face, Lord Rama is always calm and unperturbed, even in the face of adversity. His dignified and majestic appearance is impressive.<br>" '>14</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM SHARANATHRAANA TATPARAYA NAMAHA:<br>Taking on the human form, Lord Vishnu, as Rama, is determined and deeply committed to wiping away the distress of His devotees who seek refuge in Him. He achieves this perfectly and brings justice to people by upholding dharma and punishing the wrong-doers.<br>" '>15</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM VALI PRAMATHANAAYA NAMAHA:<br>Scourge of His foes, Lord Rama is the slayer of Vali, the Vanara chief of the forest who had usurped the throne of his brother, Sugreeva, and taken his wife captive. The great Lord is Dharmatma<br>" '>16</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM VAAGMINEY NAMAHA:<br>The ever-gentle and unperturbed Lord Rama is soft in speech, sedate and peaceful, and as a spokesman He never taunts, always remains calm and collected.<br>" '>17</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM SATHYAVAACHEY NAMAHA:<br>Swathed in the sweet and loving words of Lord Rama, His devotees dance with joy. His words always carry a ring of truth, for He is Truth personified. His word is law and He is the law-maker.<br>" '>18</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM SATHYAVIKRAMAYA NAMAHA:<br>Lord Rama establishes the image of an Ideal Man on the loftiest pedestal of human existence. He is the Truth that begins,the Truth that grows,and the Truth that ends.<br>" '>19</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM SATHYAVRATHAYA NAMAHA:  <br>Lord Rama,the auspiciously marked one,upholds dharma, adopting truth as penance for the sake of righteousness.<br>" '>20</button><br><br>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM VRATHADHARAAYA NAMAHA:<br>Rama is Dharmatma,the upholder of justice and dharma, and is the destroyer of evil and wrong-doers. He meditates deeply and practices austere penances to redeem mankind of misery.<br>" '>21</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM SADHAHANUMADHAASHRITHAYA NAMAHA: <br>Son of the Wind-God, Hanuman is a loyal follower of Lord Rama. The Great Lord is dependent on Hanuman to save His queen, Sita, from the clutches of the gigantic demon, Ravana, by revealing her whereabouts.<br>" '>22</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM KAUSALEYAYA NAMAHA: <br>The upholder of dharma or righteousness, Lord Rama is the darling son of Queen Kausalya. His radiance adds to her loveliness, just as Indra’s radiance enhances the beauty of Aditi.<br>" '>23</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM KHARADWAMSINEY NAMAHA:<br>The unending mine of virtues, the Supreme Unborn God, Lord Vishnu takes several incarnations to redeem the world of its demons and evils, and as Rama, He slew the fierce demon, Khara.<br>" '>24</button>

<button type ="button" onclick='document.getElementById("hcontent").innerHTML="OM VIRADHVADHAPANDITHAYA NAMAHA:<br>Supreme Lord Rama, through whom this world and all the gods, including Brahma, are manifest, is a skillful slayer of demons, redeeming the world of the dreaded demon Viradha.<br>" '>25</button>
